name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-github-stats:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
          GITHUB_USERNAME: yuvrajkarna2717
        run: |
          python scripts/github_analyzer.py

      - name: Update README
        run: |
          python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/github-stats.json README.md

          git diff --cached --quiet || \
            git commit -m "chore: update github stats"

      - name: Push changes
        run: |
          git push